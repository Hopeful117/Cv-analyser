spring.application.name=cv-analyzer
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.model=gpt-4o-mini

spring.datasource.url=jdbc:mysql://localhost:3306/cv_analyzer
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
career.google-sheets.enabled=${CAREER_GOOGLE_SHEETS_ENABLED:false}
career.google-sheets.spreadsheet-id=${CAREER_GOOGLE_SHEETS_SPREADSHEET_ID:}
career.google-sheets.applications-sheet=${CAREER_GOOGLE_SHEETS_APPLICATIONS_SHEET:Candidatures}
career.google-sheets.dashboard-sheet=${CAREER_GOOGLE_SHEETS_DASHBOARD_SHEET:Tableau de bord}
career.google-sheets.header-row=${CAREER_GOOGLE_SHEETS_HEADER_ROW:1}

# France Travail - Job Discovery
france-travail.enabled=${FRANCE_TRAVAIL_ENABLED:false}
france-travail.client-id=${FRANCE_TRAVAIL_ID:}
france-travail.client-secret=${FRANCE_TRAVAIL_SECRET_KEY:}
france-travail.token-url=${FRANCE_TRAVAIL_TOKEN_URL:https://entreprise.francetravail.fr/connexion/oauth2/access_token?realm=/partenaire}
france-travail.base-url=${FRANCE_TRAVAIL_BASE_URL:https://api.francetravail.io/partenaire/offresdemploi/v2}
