<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Entretien en cours')}"></head>
<body class="developer-os">
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('interview')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar('Entretien en cours', 'Prenez le temps de structurer une réponse claire et concrète')}"></header>
        <main class="app-content" id="main-content">
            <div class="page-stack">
                <div class="os-alert os-alert-warning">
                    <span class="os-badge os-badge-experimental">Expérimental</span>
                    Cette simulation est une aide à la préparation et ne remplace pas l’évaluation d’un recruteur.
                </div>

                <section class="os-card question-card">
                    <div class="d-flex flex-wrap gap-2">
                        <span class="os-badge os-badge-ai">Question générée par IA</span>
                        <span class="os-badge"
                              th:if="${question != null and question.category != null}"
                              th:text="${question.category}">Catégorie</span>
                    </div>
                    <p class="question-text"
                       th:if="${question != null}"
                       th:text="${question.question}">
                        Question d’entretien
                    </p>

                    <form th:action="@{/interview/{id}/answer(id=${id})}"
                          method="post"
                          class="mt-4">
                        <label class="os-label" for="answer">Votre réponse</label>
                        <textarea id="answer"
                                  name="answer"
                                  class="os-textarea"
                                  rows="7"
                                  required
                                  placeholder="Structurez votre réponse avec un contexte, vos actions et les résultats obtenus..."></textarea>
                        <p class="form-help">Votre réponse sera analysée par l’IA avant de passer à la question suivante.</p>
                        <button type="submit" class="os-button os-button-primary mt-3">
                            Envoyer la réponse
                        </button>
                    </form>
                </section>
            </div>
        </main>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
