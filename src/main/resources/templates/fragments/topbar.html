<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="app-topbar" th:fragment="topbar(title, subtitle)">
    <button id="mobileNavToggle"
            class="os-button os-button-ghost mobile-nav-toggle"
            type="button"
            aria-label="Ouvrir la navigation"
            aria-controls="appSidebar"
            aria-expanded="false">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
    </button>
    <div class="topbar-copy">
        <h1 class="topbar-title" th:text="${title}">Career Intelligence</h1>
        <p class="topbar-subtitle" th:text="${subtitle}">Pilotez votre progression professionnelle.</p>
    </div>
</header>
</body>
</html>
