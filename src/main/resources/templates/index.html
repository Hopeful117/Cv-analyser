<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CV Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="m-2">

<h1 class="h1">CV Analyzer</h1>

<form  id="analyze-form"
       method="post"
       th:action="@{/analyze}"
       enctype="multipart/form-data">

    <label class="form-label">CV PDF</label>
    <input class="form-control" type="file" name="file" id="cvFile" required>
    <br><br>
    <p class="text-muted">
        Saisissez une annonce OU une URL.
    </p>
    <br><br>
    <ul class="nav nav-tabs" id="offerTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button
                    class="nav-link active"
                    id="text-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#text-pane"
                    type="button"
                    role="tab">
                Texte de l'annonce
            </button>
        </li>

        <li class="nav-item" role="presentation">
            <button
                    class="nav-link"
                    id="url-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#url-pane"
                    type="button"
                    role="tab">
                URL de l'annonce
            </button>
        </li>
    </ul>

    <div class="tab-content mt-3">

        <div
                class="tab-pane fade show active"
                id="text-pane"
                role="tabpanel">

        <textarea
                class="form-control"
                name="jobOffer"
                rows="10"></textarea>

        </div>

        <div
                class="tab-pane fade"
                id="url-pane"
                role="tabpanel">

            <input
                    type="url"
                    class="form-control"
                    name="jobOfferUrl"
                    placeholder="https://...">

        </div>

    </div>

    <button class=" btn btn-primary my-2" type="submit" value="upload">
        Analyser
    </button>

</form>

<div
        th:if="${errorMessage}"
        class="alert alert-danger">

    <span th:text="${errorMessage}"></span>

</div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
