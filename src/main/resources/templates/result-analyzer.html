<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="m-2 d-flex flex-column gap-5">
<h1 class="h1">Résultat de l'analyse</h1>
<div class="card">
    <h2 class="card-header h2">Résultats</h2>
    <div class="card-body">
<p>
    Score global :
    <span th:text="${analysis.overallScore}">
    </span>
</p>


<p>
    Score ATS :
    <span th:text="${analysis.atsScore}">
    </span>
</p>

<p>
    Score adéquation :
    <span th:text="${analysis.jobMatchScore}">
    </span>
</p>
    </div>
</div>
<div class="card">
<h2 class="card-header h2">Risk ATS</h2>
    <div class="card-body">
<span th:if="${analysis.atsRisks ==  null or analysis.atsRisks.isEmpty()}">Aucun risque ATS</span>
<div th:each="risk:${analysis.atsRisks}">

    <span th:text="${risk}"></span>
</div>
    </div>
</div>
<div class="card">
<h2 class="card-header h2">Recommandations</h2>
    <div class="card-body">
<span th:if="${analysis.recommendations ==  null or analysis.recommendations.isEmpty()} ">Aucune recommandation</span>
<div th:each="recommandation:${analysis.recommendations}">
    <span th:text="${recommandation}"></span>
</div>
</div>
</div>
<div class="card">
<h2 class="card-header h2">Keywords manquants</h2>
    <div class="card-body">
<span th:if="${analysis.missingKeywords ==  null or analysis.missingKeywords.isEmpty()}">Aucun mot-clé manquant</span>
<div th:each="missingkey:${analysis.missingKeywords}">
    <span th:text="${missingkey}"></span>
</div>
</div>
</div>
<a class="btn btn-primary" th:href="@{/}">Home</a>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
