<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Lettre générée')}"></head>
<body class="developer-os">
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('letters')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar('Lettre générée', 'Relisez et adaptez la proposition avant de l’utiliser')}"></header>
        <main class="app-content" id="main-content">
            <div class="page-stack">
                <div th:replace="~{fragments/alerts :: alerts}"></div>
                <section class="section-heading">
                    <div>
                        <div class="d-flex flex-wrap gap-2 mb-3">
                            <span class="os-badge os-badge-ai">Contenu généré par IA</span>
                            <span class="os-badge os-badge-warning">À vérifier</span>
                        </div>
                        <h2 class="section-title">Votre proposition de lettre</h2>
                        <p class="section-description mt-2 mb-0">
                            Le texte reste entièrement modifiable. Vérifiez les faits, le ton et les coordonnées avant envoi.
                        </p>
                    </div>
                    <a th:href="@{/generator}" class="os-button os-button-secondary">Préparer une nouvelle lettre</a>
                </section>

                <form class="os-card" method="post" th:action="@{/cover-letters/{id}(id=${letter.id})}">
                    <label class="os-label" for="letterContent">Contenu de la lettre</label>
                    <textarea id="letterContent"
                              name="content"
                              class="os-textarea editor-textarea"
                              rows="18"
                              required
                              th:text="${coverLetter}"></textarea>
                    <div class="action-row">
                        <button class="os-button os-button-primary" type="submit">Enregistrer</button>
                        <button class="os-button os-button-secondary"
                                type="button"
                                data-copy-target="#letterContent">
                            Copier la lettre
                        </button>
                    </div>
                    <div class="copy-status" data-copy-status aria-live="polite"></div>
                </form>

                <div class="os-alert os-alert-info">
                    Cette lettre est sauvegardée dans l’espace local. Elle n’est jamais envoyée automatiquement.
                </div>
                <form th:action="@{/cover-letters/{id}/delete(id=${letter.id})}" method="post"
                      data-confirm="Supprimer définitivement cette lettre ?">
                    <button class="os-button os-button-danger" type="submit">Supprimer la lettre</button>
                </form>
            </div>
        </main>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
