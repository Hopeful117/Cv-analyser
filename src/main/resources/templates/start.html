<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Start Interview</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body>

<h1>Interview Simulation</h1>

<form action="/interview/start" method="post"  enctype="multipart/form-data" id="analyze-form">


    <label class="form-label">CV PDF</label>
    <input class="form-control" type="file" name="file" id="file" required>
    <br><br>
    <p class="text-muted">
        Saisissez une annonce OU une URL.
    </p>
    <br><br>
    <ul class="nav nav-tabs" id="offerTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button
                    class="nav-link active"
                    id="text-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#text-pane"
                    type="button"
                    role="tab">
                Texte de l'annonce
            </button>
        </li>

        <li class="nav-item" role="presentation">
            <button
                    class="nav-link"
                    id="url-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#url-pane"
                    type="button"
                    role="tab">
                URL de l'annonce
            </button>
        </li>
    </ul>

    <div class="tab-content mt-3">

        <div
                class="tab-pane fade show active"
                id="text-pane"
                role="tabpanel">

        <textarea
                class="form-control"
                name="jobOffer"
                rows="10"></textarea>

        </div>

        <div
                class="tab-pane fade"
                id="url-pane"
                role="tabpanel">

            <input
                    type="url"
                    class="form-control"
                    name="jobOfferUrl"
                    placeholder="https://...">

        </div>

    </div>

    <button type="submit" class="btn btn-danger">Start Interview</button>

</form>
<div
        th:if="${errorMessage}"
        class="alert alert-danger">

    <span th:text="${errorMessage}"></span>

</div>
<!-- LOADING OVERLAY -->
<div id="loadingOverlay"
     class="position-fixed top-0 start-0 w-100 h-100 d-none justify-content-center align-items-center"
     style="background: rgba(255,255,255,0.95); z-index:9999;">

    <div class="text-center" style="max-width:500px; width:90%;">

        <h2 class="mb-4">
            Génération de la simulation d'interview
        </h2>

        <div class="spinner-border text-danger mb-4"
             style="width:4rem;height:4rem;"
             role="status">
            <span class="visually-hidden">Chargement...</span>
        </div>

        <h5 id="loadingMessage">
            Analyse du profil...
        </h5>

        <p class="text-muted mt-3">
            L’IA prépare une simulation d’interview.
        </p>

    </div>
</div>
<script th:src="@{/js/loading.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
