spring.datasource.url=jdbc:h2:mem:career_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# H2 reports MySQL LONGTEXT as VARCHAR; production keeps strict Hibernate validation.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.ai.openai.api-key=test-key-not-used
spring.ai.openai.model=gpt-4o-mini
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
career.google-sheets.enabled=false
