<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Interview Simulation</title>
    <style>
        .chat {
            max-width: 800px;
            margin: auto;
        }

        .bubble {
            padding: 10px;
            margin: 10px;
            border-radius: 10px;
        }

        .question {
            background: #e3f2fd;
            text-align: left;
        }

    </style>
</head>

<body>

<div class="chat">

    <h2>Interview Simulation</h2>



    <div class="bubble question">
        <strong>Interviewer:</strong>
        <p th:text="${question.question}"></p>
    </div>

    <form th:action="@{/interview/{id}/answer(id=${id})}"
          method="post">


        <textarea name="answer"
                  rows="4"
                  cols="80"
                  placeholder="Your answer..."></textarea>

        <br/>

        <button type="submit">Send</button>
    </form>

</div>

</body>
</html>
