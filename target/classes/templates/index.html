<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CV Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="m-2">

<h1 class="h1">CV Analyzer</h1>

<form  id="analyze-form"
       method="post"
       th:action="@{/analyze}"
       enctype="multipart/form-data">

    <label class="form-label">CV PDF</label>
    <input class="form-control" type="file" name="file" id="cvFile" required>
    <br><br>
    <p>Entrez l'url de l'offre d'emploi ou copiez le texte de l'offre dans la zone prévue à cette effet</p>
    <br><br>
    <label class="form-label" for="jobOfferUrl">Url offre d'emploi</label>
    <input type="url" id="jobOfferUrl"  name="jobOfferUrl" class="form-control">
    <br><br>

    <label class="form-label" for="jobOffer">Offre d'emploi</label>

    <textarea
            class="form-control"
            id="jobOffer"
            name="jobOffer"
            rows="10"
            cols="80">
    </textarea>


    <br><br>


    <button class=" btn btn-primary" type="submit" value="upload">
        Analyser
    </button>

</form>

<div id="results"></div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
