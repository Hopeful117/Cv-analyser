<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Cover Letter Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          crossorigin="anonymous">
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- HEADER -->
    <div class="mb-4">
        <h1 class="fw-bold">Lettre de motivation générée</h1>
        <p class="text-muted">
            Tu peux la modifier, la copier ou la régénérer.
        </p>
    </div>


    <div class="d-flex gap-2 mb-3">

        <button class="btn btn-outline-secondary"
                onclick="copyLetter()">
            📋 Copier
        </button>



        <a th:href="@{/generator}"
           class="btn btn-primary">
            ✍️ Nouvelle lettre
        </a>

    </div>


    <div class="card shadow-sm border-0">

        <div class="card-header bg-white">
            <strong>Éditeur de lettre</strong>
        </div>

        <div class="card-body">

            <textarea id="letterContent"
                      class="form-control"
                      rows="18"
                      th:text="${coverLetter}">
            </textarea>

        </div>

    </div>



</div>


<script src="/js/copyLetter.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

</body>
</html>
